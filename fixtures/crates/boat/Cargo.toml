# The Rust scaffold compile check (D4): a small crate with an SDK-instrumented type. The test appends the scaffold_example patch to src/lib.rs in a
# copy of this crate and compiles it with the `paneweft` feature; the SDK is an optional development dependency behind that feature.
[package]
name = "boat"
version = "0.0.0"
edition = "2021"
publish = false

[features]
paneweft = ["dep:paneweft"]

[dependencies.paneweft]
path = "../../../crates/paneweft"
optional = true

[workspace]
